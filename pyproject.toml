[project]
name = "as-endorsed"
version = "0.1.0"
description = "Retrieval over insurance policies as endorsed: clause-level parsing, endorsement resolution, cited answers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pymupdf>=1.24",
  "reportlab>=4.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "numpy>=2",
  "rank_bm25>=0.2",
  "fastembed>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=1.0"]
pg = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
as-endorsed = "as_endorsed.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
