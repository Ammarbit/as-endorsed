services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AS_ENDORSED_LLM_MODEL: ${AS_ENDORSED_LLM_MODEL:-claude-opus-5}
    volumes:
      - appdata:/data
    # First start downloads the public forms and the embedding models, then generates
    # the synthetic accounts; later starts reuse the volume.

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: asendorsed
      POSTGRES_PASSWORD: asendorsed
      POSTGRES_DB: asendorsed
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asendorsed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  appdata:
